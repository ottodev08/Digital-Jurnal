<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.4" />

  <!-- Magic Glow Aura -->
  <circle cx="256" cy="240" r="160" fill="url(#sparkle-glow)" />

  <!-- Grimoire Book Spine & Pages -->
  <g filter="url(#glow)">
    <!-- Book Cover Back -->
    <path d="M120 140 C120 120 140 100 170 100 L370 100 C390 100 400 110 400 130 L400 390 C400 405 385 415 365 415 L170 415 C140 415 120 395 120 375 Z" fill="#312e81" stroke="url(#gold-grad)" stroke-width="6" />

    <!-- Book Pages (Open look) -->
    <path d="M140 130 C180 140 220 140 256 150 C292 140 332 140 372 130 L372 380 C332 390 292 390 256 380 C220 390 180 390 140 380 Z" fill="#fef3c7" />

    <!-- Center Book Fold line -->
    <line x1="256" y1="150" x2="256" y2="380" stroke="#d97706" stroke-width="3" stroke-dasharray="4,4" />

    <!-- Magic Emblem / Star of Arcana on Book -->
    <path d="M256 210 L266 238 L296 238 L272 256 L281 284 L256 266 L231 284 L240 256 L216 238 L246 238 Z" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1.5" />

    <!-- Magic Wand / Crystal Key -->
    <circle cx="256" cy="248" r="7" fill="#10b981" />
  </g>

  <!-- Floating Sparkles -->
  <path d="M130 90 L135 105 L150 110 L135 115 L130 130 L125 115 L110 110 L125 105 Z" fill="#fde047" />
  <path d="M380 80 L383 92 L395 95 L383 98 L380 110 L377 98 L365 95 L377 92 Z" fill="#34d399" />
  <path d="M390 320 L394 332 L406 335 L394 338 L390 350 L386 338 L374 335 L386 332 Z" fill="#fbbf24" />
</svg>
